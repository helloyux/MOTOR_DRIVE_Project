# =============================================================
# F407_DAMIAO_TEST 烧录 / 调试配置 (OpenOCD)
# 目标: STM32F407VET6 (Cortex-M4, 512K Flash / 128K RAM)
# 调试器: CMSIS-DAP (DAP-Link)
# =============================================================

# 1. 调试器接口: ARM CMSIS-DAP 协议 (DAP-Link / 兼容 DAP 调试器)
source [find interface/cmsis-dap.cfg]

# 2. 传输方式: SWD 两线 (SWDIO / SWCLK)
transport select swd

# 3. SWD 时钟 1000 kHz = 1 MHz
adapter speed 1000

# 4. 目标芯片: STM32F4 系列 (自动识别 Flash 大小与分区)
source [find target/stm32f4x.cfg]

# ---- 速度复位 -------------------------------------------------
# 注意: stm32f4x.cfg 自己会改速度 —— 第 69 行 adapter speed 2000，
# 复位时 reset-start 事件又设 2000、reset-init 事件设 8000 (烧写时提速)。
# 也就是说上面第 3 行的 1000 会被覆盖，所以这里在 source 之后再设定一次，
# 让连接/空闲状态真的跑在 1 MHz。
# 想用 OpenOCD 默认的 2 MHz(连接) / 8 MHz(烧写) 就把下面这行删掉。
adapter speed 1000
